<!DOCTYPE html>
<html>
<head>
    <title>Login - To-Do List</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>To-Do List</h1>

        <p>Login to manage your tasks</p>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?

            <a href="/register">
                Register
            </a>
        </p>

    </div>

</div>

</body>
</html>
