<!DOCTYPE html>
<html>
<head>

    <title>Register - To-Do List</title>

    <link rel="stylesheet" href="/style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>Create Account</h1>

        <p>Register for the To-Do List</p>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?

            <a href="/login">
                Login
            </a>
        </p>

    </div>

</div>

</body>
</html>
